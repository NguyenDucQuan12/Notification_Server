services:
  redis:
    image: redis:7-alpine
    container_name: redis_services
    command: ["redis-server", "--appendonly", "yes"]  # Cho phép ghi dữ liệu ra data để bindmount ra ổ đĩa
    # ports:
      # - "6379:6379"
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./redis-data:/data
    # Không publish 6379 ra Ubuntu host
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]   # 'PONG' = OK
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  
  docker_api:
    # Cài đặt và khởi động: docker-compose up --build -d
    # Dừng lại image trước khi chạy lại: docker compose down
    build:
      context: ./fastapi_server
    image: fastapi-server:0.0.1
    container_name: fastapi-server
    extra_hosts:  # Thêm extrahost khi cài trên máy ubuntu, Bắt buộc trên Docker Engine Ubuntu/Linux
    - "host.docker.internal:host-gateway"
    # Nạp tệp biến môi trường vào docker
    env_file:
      - ./env/.env.common
      - ./env/.env.api

    # === Biến môi trường cho app ===
    environment:

      # === SQL Server trên host ===
      SQL_SERVER_HOST: "host.docker.internal"   # "localhost" trong container là chính container, không phải máy host
      # Dockerfile cài msodbcsql18, nên trong container phải dùng Driver 18 (.env.api đang ghi 17 cho máy local).
      SQL_SERVER_DRIVER: "ODBC Driver 18 for SQL Server"

      # === Redis ===
      # .env.api ghi 127.0.0.1 (khi chạy local). Trong Docker phải dùng tên service "redis".
      REDIS_URL: "redis://redis:6379/0"

      # Số tiến trình API (dùng nhiều nhân CPU). Tổng kết nối SQL = API_WORKERS x (DB_POOL + DB_MAX_OVERFLOW).
      API_WORKERS: "2"

      # === Thư mục gốc lưu file upload TRONG CONTAINER ===
      UPLOAD_DIRECTORY: "/app/uploads"
      APP_UPDATE_DIR: "/app/update_application"
      API_LOG_DIRECTORY: "/app/log/api_log"
      SYSTEM_LOG_DIRECTORY: "/app/log/system_log"

      # (tuỳ chọn) CORS
      # ALLOWED_ORIGINS: "http://localhost:3000,http://172.31.99.130"
    
    # Mở port để kết nối đến bên ngoài (8000:8000) theo thứ tự PORT để các thiết bị khác truy cập: PORT mở trong code và ở container
    ports:
      # - "8000:8000"
      # - "${PORT_HOST}:8000"
      - "${TAILSCALE_IP}:8001:8000"    # Client có thể truy cập api thông qua địa chỉ ip của tailscale:8001/api/xxx
    networks:
      - backend_network
    # === Bind mount các thư mục cần ghi/đọc ===
    volumes:
      # Thư mục lưu file upload: host ./assets/file -> container /app/uploads
      - type: bind
        source: ./assets/file  # Đường dẫn trên máy chủ
        target: /app/uploads   # Đường dẫn trong container (Phải trùng với khai báo phía trên)

      # Thư mục lưu file cập nhật phần mềm: host ./assets/update_application -> container /app/update_application
      - type: bind
        source: ./assets/update_application  # Đường dẫn trên máy chủ
        target: /app/update_application   # Đường dẫn trong container (Phải trùng với khai báo phía trên)

      # Thư mục chứa log khi gọi api
      - type: bind
        source: ./log/api_log  # Đường dẫn trên máy chủ
        target: /app/log/api_log # Đường dẫn trong container (Phải trùng với khai báo phía trên)

      # Thư mục chứa log hệ thống
      - type: bind
        source: ./log/system_log  # Đường dẫn trên máy chủ
        target: /app/log/system_log # Đường dẫn trong container (Phải trùng với khai báo phía trên)
      
    depends_on:
      redis:          # đảm bảo Redis được khởi chạy trước api, tuy nhiên việc Redis sẵn sàng truy vấn khi api khởi động xong hay không thì chưa chắc
        condition: service_healthy   # Thêm 1 điều kiện để chỉ start API khi Redis “healthy”                                    

    # === Tự khởi động lại nếu crash ngoài ý muốn (Không khởi động lại do người dùng chủ động stop) ===
    restart: unless-stopped
    # Kiểm tra tình trạng của server
    # Lệnh curl ... chạy trong chính container của service, không phải trên máy host.
    # localhost nghĩa là bên trong container. Và app đang lắng nghe nội bộ cổng 8000
    # -fsS ≈ --fail --silent --show-error: nếu HTTP status >= 400 thì trả về là lỗi, tắt progress/verbose (đỡ noisy), đi kèm -s để vẫn hiện lỗi khi fail (hữu ích để debug log).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 30s  # mỗi 30s kiểm tra một lần.
      timeout: 5s  # quá 5s chưa xong xem như fail.
      retries: 3  #  fail liên tiếp 3 lần → container unhealthy
      start_period: 15s  # chờ 15s sau khi container start rồi mới tính fail.
  noti_server:
    # Notification Server: đọc Redis Stream và đẩy thông báo realtime qua WebSocket.
    build:
      context: ./noti_server
    image: noti-server:2.0.0
    container_name: noti-server
    env_file:
      - ./env/.env.common
      - ./env/.env.noti
    environment:
      # Ghi đè REDIS_URL của .env.common (127.0.0.1 chỉ đúng khi chạy local, trong Docker phải dùng tên service).
      REDIS_URL: "redis://redis:6379/0"
      PORT: "8000"
      # .env.noti ghi "development" cho chạy local; trong Docker chạy production (tắt /docs, log JSON).
      ENVIRONMENT: "production"
    ports:
      - "${TAILSCALE_IP}:1234:8000"   # Client kết nối ws://<TAILSCALE_IP>:1234/noti/ws/...
    networks:
      - backend_network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Mỗi WebSocket là 1 file descriptor. Mặc định Linux chỉ cho 1024 -> nâng lên để phục vụ hàng nghìn kết nối.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Cho server 15 giây để đóng các WebSocket với code 1012 trước khi Docker kill.
    stop_grace_period: 15s
    healthcheck:
      # Dùng /health/ready: báo unhealthy khi mất Redis.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification-worker:
    # Outbox Worker: quét notification_outbox còn 'pending' và publish lại vào Redis.
    build:
      context: ./fastapi_server
    image: fastapi-server:0.0.1        # Cùng image với docker_api, build 1 lần dùng cho cả 2.
    container_name: notification-worker
    working_dir: /app/src              # Để "python -m workers..." import được db/, services/
    command: ["python", "-m", "workers.notification_outbox_worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./env/.env.common
      - ./env/.env.api
    environment:
      SQL_SERVER_HOST: "host.docker.internal"
      SQL_SERVER_DRIVER: "ODBC Driver 18 for SQL Server"
      REDIS_URL: "redis://redis:6379/0"
      NOTIFICATION_WORKER_POLL_SECONDS: "1"
      NOTIFICATION_WORKER_BATCH_SIZE: "500"
    networks:
      - backend_network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s             # Cho worker xử lý nốt batch đang chạy khi docker stop.

  job-worker:
    # Job Worker: lấy job từ Redis queue, xử lý file, cập nhật job_record và gửi thông báo tiến trình.
    build:
      context: ./fastapi_server
    image: fastapi-server:0.0.1        # Cùng image với docker_api.
    container_name: job-worker
    working_dir: /app/src
    command: ["python", "-m", "workers.job_worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./env/.env.common
      - ./env/.env.api
    environment:
      SQL_SERVER_HOST: "host.docker.internal"
      SQL_SERVER_DRIVER: "ODBC Driver 18 for SQL Server"
      REDIS_URL: "redis://redis:6379/0"
      UPLOAD_DIRECTORY: "/app/uploads"
      JOB_WORKER_CONCURRENCY: "2"
    volumes:
      # PHẢI trùng volume upload của docker_api: worker đọc file do API lưu và ghi file kết quả.
      - type: bind
        source: ./assets/file
        target: /app/uploads
    networks:
      - backend_network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s             # Cho worker xử lý nốt job đang chạy khi docker stop.

networks:
  backend_network:
    driver: bridge
